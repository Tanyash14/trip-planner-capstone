# Databricks App config for the trip planner frontend (Streamlit).
# Source code path when deploying from Git: frontend (self-contained).
#
# Attach the SAME Lakebase Database resource here as on mcp_server (App
# resources -> + Add resource -> Database -> same project/branch/database)
# so the frontend and the agent's tools see the same data - two separate
# Databricks Apps each have their own local disk, so the sqlite fallback
# below won't be shared between them. See mcp_server/app.yaml for the full
# explanation of ENDPOINT_NAME / PGHOST etc.

command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port"
  - "8000"
  - "--server.address"
  - "0.0.0.0"

env:
  - name: "ENDPOINT_NAME"
    value: "projects/trip-planner-db/branches/production/endpoints/primary"
  - name: "DATABASE_URL"
    value: "sqlite:///trip_planner.db"
  - name: "EMBEDDING_ENDPOINT"
    value: "databricks-gte-large-en"
